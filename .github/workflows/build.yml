name: build

on:
  push:
    branches: [main, init, 'ci-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      VERSION: 0.2.0
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version && sw_vers

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: zonic-macos
          path: dist/*

      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/init')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          (cd dist && shasum -a 256 ./* > SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt \
              --title "Zonic $VERSION" \
              --notes-file RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi
