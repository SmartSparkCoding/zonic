name: windows

# Builds the Windows app. It attaches its zip to the release the macOS workflow just
# published, rather than making one of its own, so a push still produces a single release
# with both platforms in it.

on:
  pull_request:
  workflow_run:
    workflows: ["build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: >
          dotnet publish windows/Zonic.Windows/Zonic.Windows.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o dist-windows

      - name: Package
        shell: pwsh
        run: |
          Copy-Item RELEASE_NOTES.md dist-windows/
          $version = (Select-String -Path windows/Zonic.Windows/Zonic.Windows.csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          Compress-Archive -Path dist-windows/Zonic.exe, dist-windows/RELEASE_NOTES.md -DestinationPath "Zonic-$version-windows.zip"
          Get-ChildItem Zonic-*-windows.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: zonic-windows
          path: Zonic-*-windows.zip
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = gh release view --json tagName -q .tagName
          if (-not $tag) {
            Write-Host "No release to attach to yet."
            exit 0
          }
          $zip = (Get-ChildItem Zonic-*-windows.zip).Name
          Write-Host "Uploading $zip to $tag"
          gh release upload $tag $zip --clobber
